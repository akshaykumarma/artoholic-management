services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: artoholic
      POSTGRES_PASSWORD: artoholic
      POSTGRES_DB: artoholic
    ports: ["5432:5432"]
    volumes: [db-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U artoholic"]
      interval: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: artoholic
      MINIO_ROOT_PASSWORD: artoholic-minio
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio-data:/data]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "mc alias set local http://minio:9000 artoholic artoholic-minio && mc mb --ignore-existing local/artoholic"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgres://artoholic:artoholic@db:5432/artoholic
      S3_ENDPOINT: http://minio:9000
    ports: ["3000:3000"]
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped

volumes:
  db-data:
  minio-data:
