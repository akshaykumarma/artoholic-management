# 011 T009: a tag mobile-vX.Y.Z builds both apps on EAS and submits them to the internal tracks
# (Play internal testing, TestFlight). Promotion to the public stores happens in the store consoles
# after the release checklist is complete (Admin console → App releases).
name: mobile-release
on:
  push:
    tags: ['mobile-v*']
jobs:
  build-and-submit:
    runs-on: ubuntu-latest
    if: ${{ vars.EAS_ENABLED == 'true' }}
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
        working-directory: .
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Check the tag matches the app version
        run: |
          tag="${GITHUB_REF_NAME#mobile-v}"
          app=$(node -e "console.log(require('./package.json').version)")
          test "$tag" = "$app" || { echo "Tag $tag does not match apps/mobile version $app"; exit 1; }
      - run: eas build --platform all --profile production --non-interactive --auto-submit-with-profile production
        env:
          EAS_PROJECT_ID: ${{ vars.EAS_PROJECT_ID }}
