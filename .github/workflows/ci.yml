name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: artoholic
          POSTGRES_PASSWORD: artoholic
          POSTGRES_DB: artoholic_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U artoholic" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgres://artoholic:artoholic@localhost:5432/artoholic_test
      DATABASE_URL_TEST: postgres://artoholic:artoholic@localhost:5432/artoholic_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
